name: PKap BLCKSWAN BT APK

on:
  push:
    branches:
      - 'agent/pkapbt-variant'
  workflow_dispatch:

concurrency:
  group: pkap-bt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract PKap BT source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q variants/PKap-BLCKSWAN-BT-ci-source.zip -d work
          test -f work/pkap-android/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: work/pkap-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package APK
        run: |
          mkdir -p artifacts
          cp work/pkap-android/app/build/outputs/apk/debug/app-debug.apk artifacts/PKap-BLCKSWAN-BT-debug.apk
          sha256sum artifacts/PKap-BLCKSWAN-BT-debug.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKap-BLCKSWAN-BT-debug-apk
          path: artifacts/*
          retention-days: 30
